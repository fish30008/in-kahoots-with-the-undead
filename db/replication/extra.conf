# Extra settings for every node of the replicated databases (player-db, game-db),
# mounted into the image's conf.d by compose.yml.

# Prepared transactions are off by default. The two phase commit of grade 8 needed
# them (git history); the saga that replaced it does not. Left on: a replica must
# allow at least as many as its primary, so changing it means restarting every node.
max_prepared_transactions = 10
