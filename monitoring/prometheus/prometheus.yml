# Prometheus scrapes /metrics on port 9100 of every instance of our services.
# Which instances exist is asked of our own Service Discovery (GET /prometheus),
# so a new copy is scraped as soon as it registers; nothing to edit here.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: services
    http_sd_configs:
      - url: http://discovery:8090/prometheus
        refresh_interval: 10s

  # The Service Discovery does not register with itself.
  - job_name: discovery
    static_configs:
      - targets: ["discovery:9100"]
        labels:
          app: discovery
