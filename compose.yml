services:
  player-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PLAYER_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${PLAYER_POSTGRES_PASSWORD:-qwerty}
      POSTGRES_DB: ${PLAYER_POSTGRES_DB:-player}
    volumes:
      - player-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLAYER_POSTGRES_USER:-postgres} -d ${PLAYER_POSTGRES_DB:-player}"]
      interval: 5s
      timeout: 5s
      retries: 10

  player:
    image: ${DOCKERHUB_USERNAME:-fish3008}/player_service:${PLAYER_SERVICE_TAG:-2}
    restart: unless-stopped
    environment:
      PORT: ${PLAYER_PORT:-8081}
      DATABASE_URL: postgres://${PLAYER_POSTGRES_USER:-postgres}:${PLAYER_POSTGRES_PASSWORD:-qwerty}@player-db:5432/${PLAYER_POSTGRES_DB:-player}?sslmode=disable
      # Signs the access tokens; the gateway verifies them with the same value.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Checked on GET /events, the WebSocket Base, Crafting and Resource read
      # Player's events from.
      INTERNAL_KEY: ${INTERNAL_KEY:-changeme}
      TASK_TIMEOUT: ${TASK_TIMEOUT:-30}
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-100}
    ports:
      # Published for the health check only; every other request goes through
      # the gateway.
      - "${PLAYER_PORT:-8081}:${PLAYER_PORT:-8081}"
    depends_on:
      player-db:
        condition: service_healthy

  game-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GAME_POSTGRES_USER:-game}
      POSTGRES_PASSWORD: ${GAME_POSTGRES_PASSWORD:-qwerty}
      POSTGRES_DB: ${GAME_POSTGRES_DB:-game_service}
    ports:
      # Exposed for psql. Drop this mapping to keep the database reachable only
      # inside the network.
      - "${GAME_POSTGRES_PORT:-5433}:5432"
    volumes:
      - game-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GAME_POSTGRES_USER:-game} -d ${GAME_POSTGRES_DB:-game_service}"]
      interval: 5s
      timeout: 5s
      retries: 10

  game:
    image: ${DOCKERHUB_USERNAME:-fish3008}/game_service:${GAME_SERVICE_TAG:-2}
    restart: unless-stopped
    environment:
      PORT: ${GAME_PORT:-8082}
      DATABASE_URL: postgres://${GAME_POSTGRES_USER:-game}:${GAME_POSTGRES_PASSWORD:-qwerty}@game-db:5432/${GAME_POSTGRES_DB:-game_service}?sslmode=disable
      # Service-to-service REST goes through the gateway, which forwards
      # /players to the player service.
      PLAYER_SERVICE_URL: http://gateway:8080
      # Sent as X-Internal-Key, so the gateway accepts game as a service.
      INTERNAL_KEY: ${INTERNAL_KEY:-changeme}
      # Empty means the built-in exam mock.
      EXAM_SERVICE_URL: ${EXAM_SERVICE_URL:-}
      DAY_PHASE_SECONDS: ${DAY_PHASE_SECONDS:-600}
      NIGHT_PHASE_SECONDS: ${NIGHT_PHASE_SECONDS:-300}
      TICK_INTERVAL_MS: ${TICK_INTERVAL_MS:-1000}
      # Divides every action duration and both phase lengths; 60 for a demo.
      DEMO_SPEEDUP: ${DEMO_SPEEDUP:-1}
      TASK_TIMEOUT: ${TASK_TIMEOUT:-30}
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-100}
    ports:
      # Published because the live WebSocket goes straight to this service: the
      # gateway only hands out its URL (GET /ws/game).
      - "${GAME_PORT:-8082}:${GAME_PORT:-8082}"
    depends_on:
      game-db:
        condition: service_healthy

  base-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BASE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${BASE_POSTGRES_PASSWORD:-qwerty}
      POSTGRES_DB: ${BASE_POSTGRES_DB:-base}
    volumes:
      - base-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BASE_POSTGRES_USER:-postgres} -d ${BASE_POSTGRES_DB:-base}"]
      interval: 5s
      timeout: 5s
      retries: 10

  base:
    image: ${BASE_DOCKERHUB_USERNAME:-mixam052}/kahoots-base-service:${BASE_SERVICE_TAG:-2}
    restart: unless-stopped
    environment:
      PORT: ${BASE_PORT:-8087}
      DATABASE_URL: postgres://${BASE_POSTGRES_USER:-postgres}:${BASE_POSTGRES_PASSWORD:-qwerty}@base-db:5432/${BASE_POSTGRES_DB:-base}?sslmode=disable
      INTERNAL_KEY: ${INTERNAL_KEY:-changeme}
      # REST to Resource, World and Player goes through the gateway, which also
      # negotiates the URL of Player's event stream
      GATEWAY_URL: http://gateway:8080
      TASK_TIMEOUT_MS: ${BASE_TASK_TIMEOUT_MS:-10000}
      MAX_CONCURRENT_TASKS: ${BASE_MAX_CONCURRENT_TASKS:-100}
    depends_on:
      base-db:
        condition: service_healthy

  crafting-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CRAFTING_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${CRAFTING_POSTGRES_PASSWORD:-qwerty}
      POSTGRES_DB: ${CRAFTING_POSTGRES_DB:-crafting}
    volumes:
      - crafting-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CRAFTING_POSTGRES_USER:-postgres} -d ${CRAFTING_POSTGRES_DB:-crafting}"]
      interval: 5s
      timeout: 5s
      retries: 10

  crafting:
    image: ${CRAFTING_DOCKERHUB_USERNAME:-mixam052}/kahoots-crafting-service:${CRAFTING_SERVICE_TAG:-2}
    restart: unless-stopped
    environment:
      PORT: ${CRAFTING_PORT:-8088}
      DATABASE_URL: postgres://${CRAFTING_POSTGRES_USER:-postgres}:${CRAFTING_POSTGRES_PASSWORD:-qwerty}@crafting-db:5432/${CRAFTING_POSTGRES_DB:-crafting}?sslmode=disable
      INTERNAL_KEY: ${INTERNAL_KEY:-changeme}
      # REST to Resource and Player goes through the gateway, which also negotiates
      # the URLs of Player's, Exam's and World's event streams
      GATEWAY_URL: http://gateway:8080
      TASK_TIMEOUT_MS: ${CRAFTING_TASK_TIMEOUT_MS:-10000}
      MAX_CONCURRENT_TASKS: ${CRAFTING_MAX_CONCURRENT_TASKS:-100}
    depends_on:
      crafting-db:
        condition: service_healthy

  exam-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EXAM_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${EXAM_POSTGRES_PASSWORD:-qwerty}
      POSTGRES_DB: ${EXAM_POSTGRES_DB:-exam}
    volumes:
      - exam-db-data:/var/lib/postgresql/data
      - ./db/exam-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EXAM_POSTGRES_USER:-postgres} -d ${EXAM_POSTGRES_DB:-exam}"]
      interval: 5s
      timeout: 5s
      retries: 10

  exam:
    image: ${EXAM_DOCKERHUB_USERNAME:-inercaso}/exam-service:${EXAM_SERVICE_TAG:-2}
    restart: unless-stopped
    environment:
      PORT: ${EXAM_PORT:-8083}
      DATABASE_URL: postgres://${EXAM_POSTGRES_USER:-postgres}:${EXAM_POSTGRES_PASSWORD:-qwerty}@exam-db:5432/${EXAM_POSTGRES_DB:-exam}?sslmode=disable
      INTERNAL_KEY: ${INTERNAL_KEY:-changeme}
      TASK_TIMEOUT_MS: ${EXAM_TASK_TIMEOUT_MS:-10000}
      MAX_CONCURRENT_TASKS: ${EXAM_MAX_CONCURRENT_TASKS:-100}
      # REST to Player and Zombie goes through the gateway; `mock` = built-in stand-ins
      GATEWAY_URL: http://gateway:8080
      PLAYER_CLIENT: ${EXAM_PLAYER_CLIENT:-http}
      ZOMBIE_CLIENT: ${EXAM_ZOMBIE_CLIENT:-http}
    depends_on:
      exam-db:
        condition: service_healthy

  world-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${WORLD_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${WORLD_POSTGRES_PASSWORD:-qwerty}
      POSTGRES_DB: ${WORLD_POSTGRES_DB:-world}
    volumes:
      - world-db-data:/var/lib/postgresql/data
      - ./db/world-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WORLD_POSTGRES_USER:-postgres} -d ${WORLD_POSTGRES_DB:-world}"]
      interval: 5s
      timeout: 5s
      retries: 10

  world:
    image: ${WORLD_DOCKERHUB_USERNAME:-inercaso}/world-service:${WORLD_SERVICE_TAG:-2}
    restart: unless-stopped
    environment:
      PORT: ${WORLD_PORT:-8084}
      DATABASE_URL: postgres://${WORLD_POSTGRES_USER:-postgres}:${WORLD_POSTGRES_PASSWORD:-qwerty}@world-db:5432/${WORLD_POSTGRES_DB:-world}?sslmode=disable
      INTERNAL_KEY: ${INTERNAL_KEY:-changeme}
      TASK_TIMEOUT_MS: ${WORLD_TASK_TIMEOUT_MS:-10000}
      MAX_CONCURRENT_TASKS: ${WORLD_MAX_CONCURRENT_TASKS:-100}
      # `gateway` = ask the gateway for Exam's /events URL, then connect directly;
      # `off` = not connected (use POST /world/internal/events)
      EXAM_EVENTS_URL: ${WORLD_EXAM_EVENTS_URL-gateway}
      GATEWAY_URL: http://gateway:8080
    depends_on:
      world-db:
        condition: service_healthy

  zombie-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ZOMBIE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${ZOMBIE_POSTGRES_PASSWORD:-qwerty}
      POSTGRES_DB: ${ZOMBIE_POSTGRES_DB:-zombie}
    volumes:
      - zombie-db-data:/var/lib/postgresql/data
      - ./db/zombie-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ZOMBIE_POSTGRES_USER:-postgres} -d ${ZOMBIE_POSTGRES_DB:-zombie}"]
      interval: 5s
      timeout: 5s
      retries: 10

  zombie:
    image: ${ZOMBIE_DOCKERHUB_USERNAME:-nevaletik}/kahoot-zombie-service:${ZOMBIE_SERVICE_TAG:-2}
    restart: unless-stopped
    environment:
      PORT: ${ZOMBIE_PORT:-8085}
      INTERNAL_API_KEY: ${INTERNAL_KEY:-changeme}
      TASK_TIMEOUT_MS: ${ZOMBIE_TASK_TIMEOUT_MS:-10000}
      MAX_CONCURRENT_TASKS: ${ZOMBIE_MAX_CONCURRENT_TASKS:-100}
      DB_HOST: zombie-db
      DB_PORT: 5432
      DB_USERNAME: ${ZOMBIE_POSTGRES_USER:-postgres}
      DB_PASSWORD: ${ZOMBIE_POSTGRES_PASSWORD:-qwerty}
      DB_NAME: ${ZOMBIE_POSTGRES_DB:-zombie}
    depends_on:
      zombie-db:
        condition: service_healthy

  resource-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RESOURCE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${RESOURCE_POSTGRES_PASSWORD:-qwerty}
      POSTGRES_DB: ${RESOURCE_POSTGRES_DB:-resource}
    volumes:
      - resource-db-data:/var/lib/postgresql/data
      - ./db/resource-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESOURCE_POSTGRES_USER:-postgres} -d ${RESOURCE_POSTGRES_DB:-resource}"]
      interval: 5s
      timeout: 5s
      retries: 10

  resource:
    image: ${RESOURCE_DOCKERHUB_USERNAME:-nevaletik}/kahoot-resource-service:${RESOURCE_SERVICE_TAG:-2}
    restart: unless-stopped
    environment:
      PORT: ${RESOURCE_PORT:-8086}
      INTERNAL_API_KEY: ${INTERNAL_KEY:-changeme}
      TASK_TIMEOUT_MS: ${RESOURCE_TASK_TIMEOUT_MS:-10000}
      MAX_CONCURRENT_TASKS: ${RESOURCE_MAX_CONCURRENT_TASKS:-100}
      DB_HOST: resource-db
      DB_PORT: 5432
      DB_USERNAME: ${RESOURCE_POSTGRES_USER:-postgres}
      DB_PASSWORD: ${RESOURCE_POSTGRES_PASSWORD:-qwerty}
      DB_NAME: ${RESOURCE_POSTGRES_DB:-resource}
      # World is called through the gateway; empty = built-in World mock
      WORLD_SERVICE_URL: ${RESOURCE_WORLD_SERVICE_URL-http://gateway:8080}
      # empty = not connected (use POST /resources/internal/events): the game
      # service does not serve /events yet. `gateway` = ask the gateway for the
      # producer's /events URL, then connect directly.
      PLAYER_EVENTS_URL: ${RESOURCE_PLAYER_EVENTS_URL-}
      GAME_EVENTS_URL: ${RESOURCE_GAME_EVENTS_URL-}
      GATEWAY_URL: http://gateway:8080
    depends_on:
      resource-db:
        condition: service_healthy

  gateway:
    # The single point of entry: http://localhost:8080.
    image: ${DOCKERHUB_USERNAME:-fish3008}/gateway_service:${GATEWAY_SERVICE_TAG:-2}
    restart: unless-stopped
    environment:
      PLAYER_SERVICE_URL: http://player:${PLAYER_PORT:-8081}
      GAME_SERVICE_URL: http://game:${GAME_PORT:-8082}
      EXAM_SERVICE_URL: http://exam:${EXAM_PORT:-8083}
      WORLD_SERVICE_URL: http://world:${WORLD_PORT:-8084}
      ZOMBIE_SERVICE_URL: http://zombie:${ZOMBIE_PORT:-8085}
      RESOURCE_SERVICE_URL: http://resource:${RESOURCE_PORT:-8086}
      BASE_SERVICE_URL: http://base:${BASE_PORT:-8087}
      CRAFTING_SERVICE_URL: http://crafting:${CRAFTING_PORT:-8088}
      # Handed to clients by GET /ws/game, so it is the address on the host.
      GAME_PUBLIC_WS_URL: ws://localhost:${GAME_PORT:-8082}
      # HS256 with the secret the player service signs its tokens with.
      AUTH_MODE: secret
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      INTERNAL_KEY: ${INTERNAL_KEY:-changeme}
      TASK_TIMEOUT: ${TASK_TIMEOUT:-30}
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-100}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - player
      - game
      - exam
      - world
      - zombie
      - resource
      - base
      - crafting

  client:
    image: ${CLIENT_DOCKERHUB_USERNAME:-mixam052}/kahoots-client:${CLIENT_SERVICE_TAG:-2}
    restart: unless-stopped
    environment:
      # the browser only calls the client's own /api, which nginx proxies to the gateway
      GATEWAY_URL: http://gateway:8080
      # lets the app perform service actions (start an exam, grant XP); it reaches the
      # browser, so leave it empty outside local development
      DEV_INTERNAL_KEY: ${CLIENT_DEV_INTERNAL_KEY:-}
    ports:
      - "${CLIENT_PORT:-3000}:80"
    depends_on:
      - gateway

volumes:
  player-db-data:
  game-db-data:
  base-db-data:
  crafting-db-data:
  exam-db-data:
  world-db-data:
  zombie-db-data:
  resource-db-data:
